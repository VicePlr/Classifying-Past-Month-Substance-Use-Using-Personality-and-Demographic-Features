<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Personality meets data</title>
  <desc id="description">A midnight constellation of the five personality dimensions, with project statistics for a study of past-month substance use.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e20"/>
      <stop offset="0.55" stop-color="#151934"/>
      <stop offset="1" stop-color="#242044"/>
